<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student - Student Attendance</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body class="dashboard-page">

    <nav class="navbar navbar-dark dashboard-navbar">

        <div class="container-fluid">

            <a
                href="{{ url_for('dashboard') }}"
                class="navbar-brand fw-bold"
            >
                Student Attendance
            </a>

            <div>

                <span class="text-white me-3">
                    Welcome, {{ session["username"] }}
                </span>

                <a
                    href="{{ url_for('logout') }}"
                    class="btn btn-light btn-sm"
                >
                    Logout
                </a>

            </div>

        </div>

    </nav>


    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="fw-bold">
                    Edit Student
                </h2>

                <p class="text-muted">
                    Update student information
                </p>
            </div>

            <a
                href="{{ url_for('students') }}"
                class="btn btn-secondary"
            >
                ← Back to Students
            </a>

        </div>


        <div class="form-card">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Student Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ student.name }}"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ student.email or '' }}"
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ student.phone or '' }}"
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Course
                        </label>

                        <input
                            type="text"
                            name="course"
                            class="form-control"
                            value="{{ student.course }}"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Semester
                        </label>

                        <select
                            name="semester"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Semester
                            </option>

                            <option
                                value="1"
                                {% if student.semester == 1 %}selected{% endif %}
                            >
                                1st Semester
                            </option>

                            <option
                                value="2"
                                {% if student.semester == 2 %}selected{% endif %}
                            >
                                2nd Semester
                            </option>

                            <option
                                value="3"
                                {% if student.semester == 3 %}selected{% endif %}
                            >
                                3rd Semester
                            </option>

                            <option
                                value="4"
                                {% if student.semester == 4 %}selected{% endif %}
                            >
                                4th Semester
                            </option>

                        </select>

                    </div>

                </div>


                <div class="mt-3">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Update Student
                    </button>

                    <a
                        href="{{ url_for('students') }}"
                        class="btn btn-secondary ms-2"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
